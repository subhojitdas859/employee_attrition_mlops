apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-attrition-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-attrition
  template:
    metadata:
      labels:
        app: employee-attrition
    spec:
      containers:
      - name: employee-attrition
        image: subhojitdasie/employee_attrition:latest
        ports:
        - containerPort: 5000